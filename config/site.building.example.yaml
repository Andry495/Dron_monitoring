# Площадка — стационар на здании (простой вариант)
# cp config/site.building.example.yaml config/site.yaml
#
# Камеры на углах крыши/здания; в центре — купол с мини-ПК и switch (без камер на куполе).
# ENU origin = центр купола (проекция на крышу).

site:
  name: building-01
  lat: 0.0
  lon: 0.0
  altitude_m: 0
  magnetic_declination_deg: 0
  orientation_deg: 0

deployment:
  type: building_corners
  # building_corners | cube_compact  (см. docs/deployment-building.md)
  mobile: false

network:
  subnet: 192.168.10.0/24
  mini_pc: 192.168.10.10

ai_engine:
  url: http://127.0.0.1:8090
  detect_fps: 2
  sky_substream: true

# --- Центральный купол (хаб) ---
# Только вычислитель и сеть; камеры сюда не вешаем
center_hub:
  label: dome-hub
  offset_enu_m: [0.0, 0.0, 0.0]
  height_m: 2.5
  contains: [mini_pc, switch, ups]

# --- Габариты здания (для расчёта offset камер) ---
building:
  half_width_m: 15.0    # полуоси от центра по E (м)
  half_depth_m: 12.0    # полуоси от центра по N (м)
  corner_mount_height_m: 12.0

# --- Небо: 4× фикс на углах здания, смотрят вовне и вверх ---
sky_cameras:
  - id: sky_ne
    ip: 192.168.10.11
    rtsp_main: rtsp://192.168.10.11:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.11:554/Streaming/Channels/102
    corner: ne
    sector_az_deg: 45
    mount_tilt_deg: 30
    offset_en_m: [15.0, 12.0, 12.0]
    overlap_deg: 20

  - id: sky_se
    ip: 192.168.10.12
    rtsp_main: rtsp://192.168.10.12:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.12:554/Streaming/Channels/102
    corner: se
    sector_az_deg: 135
    mount_tilt_deg: 30
    offset_en_m: [15.0, -12.0, 12.0]
    overlap_deg: 20

  - id: sky_sw
    ip: 192.168.10.13
    rtsp_main: rtsp://192.168.10.13:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.13:554/Streaming/Channels/102
    corner: sw
    sector_az_deg: 225
    mount_tilt_deg: 30
    offset_en_m: [-15.0, -12.0, 12.0]
    overlap_deg: 20

  - id: sky_nw
    ip: 192.168.10.14
    rtsp_main: rtsp://192.168.10.14:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.14:554/Streaming/Channels/102
    corner: nw
    sector_az_deg: 315
    mount_tilt_deg: 30
    offset_en_m: [-15.0, 12.0, 12.0]
    overlap_deg: 20

# --- PTZ: 4× на тех же углах (чуть выше или на той же мачте) ---
ptz_cameras:
  - id: ptz_ne
    model: DS-2DE4A425IWG-E
    ip: 192.168.10.21
    rtsp_main: rtsp://192.168.10.21:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.21:554/Streaming/Channels/102
    onvif_port: 80
    onvif_user: admin
    corner: ne
    base_az_deg: 45
    offset_en_m: [15.0, 12.0, 12.5]

  - id: ptz_se
    model: DS-2DE4A425IWG-E
    ip: 192.168.10.22
    rtsp_main: rtsp://192.168.10.22:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.22:554/Streaming/Channels/102
    onvif_port: 80
    onvif_user: admin
    corner: se
    base_az_deg: 135
    offset_en_m: [15.0, -12.0, 12.5]

  - id: ptz_sw
    model: DS-2DE4A425IWG-E
    ip: 192.168.10.23
    rtsp_main: rtsp://192.168.10.23:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.23:554/Streaming/Channels/102
    onvif_port: 80
    onvif_user: admin
    corner: sw
    base_az_deg: 225
    offset_en_m: [-15.0, -12.0, 12.5]

  - id: ptz_nw
    model: DS-2DE4A425IWG-E
    ip: 192.168.10.24
    rtsp_main: rtsp://192.168.10.24:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.24:554/Streaming/Channels/102
    onvif_port: 80
    onvif_user: admin
    corner: nw
    base_az_deg: 315
    offset_en_m: [-15.0, 12.0, 12.5]

ptz_calibration:
  zoom_curve:
    - { zoom: 0.0, hfov_deg: 53.3, vfov_deg: 30.6 }
    - { zoom: 0.5, hfov_deg: 8.0, vfov_deg: 4.5 }
    - { zoom: 1.0, hfov_deg: 2.6, vfov_deg: 1.5 }

bound_turrets:
  - id: turret-01
    config: config/turrets/turret-01.yaml
    enabled: false
    optional: true
  - id: turret-02
    config: config/turrets/turret-02.yaml
    enabled: false
    optional: true
