# Площадка — комплект v1
# Скопировать в config/site.yaml

site:
  name: cube-01
  lat: 0.0
  lon: 0.0
  altitude_m: 0
  magnetic_declination_deg: 0
  orientation_deg: 0  # 0 = грань N на истинный север

network:
  subnet: 192.168.10.0/24
  mini_pc: 192.168.10.10

ai_engine:
  url: http://127.0.0.1:8090
  detect_fps: 2
  sky_substream: true

# --- Небо: 4× фикс, середины сторон верхней грани ---
sky_cameras:
  - id: sky_north
    ip: 192.168.10.11
    rtsp_main: rtsp://192.168.10.11:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.11:554/Streaming/Channels/102
    sector_az_deg: 0
    mount_tilt_deg: 25
    overlap_deg: 20

  - id: sky_east
    ip: 192.168.10.12
    rtsp_main: rtsp://192.168.10.12:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.12:554/Streaming/Channels/102
    sector_az_deg: 90
    mount_tilt_deg: 25
    overlap_deg: 20

  - id: sky_south
    ip: 192.168.10.13
    rtsp_main: rtsp://192.168.10.13:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.13:554/Streaming/Channels/102
    sector_az_deg: 180
    mount_tilt_deg: 25
    overlap_deg: 20

  - id: sky_west
    ip: 192.168.10.14
    rtsp_main: rtsp://192.168.10.14:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.14:554/Streaming/Channels/102
    sector_az_deg: 270
    mount_tilt_deg: 25
    overlap_deg: 20

# --- Углы: 4× PTZ Hikvision DS-2DE4A425IWG-E ---
ptz_cameras:
  - id: ptz_ne
    model: DS-2DE4A425IWG-E
    ip: 192.168.10.21
    rtsp_main: rtsp://192.168.10.21:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.21:554/Streaming/Channels/102
    onvif_port: 80
    onvif_user: admin
    # onvif_password: в .env
    corner: ne
    base_az_deg: 45
    offset_en_m: [0.5, 0.5]

  - id: ptz_se
    model: DS-2DE4A425IWG-E
    ip: 192.168.10.22
    rtsp_main: rtsp://192.168.10.22:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.22:554/Streaming/Channels/102
    onvif_port: 80
    onvif_user: admin
    corner: se
    base_az_deg: 135
    offset_en_m: [0.5, -0.5]

  - id: ptz_sw
    model: DS-2DE4A425IWG-E
    ip: 192.168.10.23
    rtsp_main: rtsp://192.168.10.23:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.23:554/Streaming/Channels/102
    onvif_port: 80
    onvif_user: admin
    corner: sw
    base_az_deg: 225
    offset_en_m: [-0.5, -0.5]

  - id: ptz_nw
    model: DS-2DE4A425IWG-E
    ip: 192.168.10.24
    rtsp_main: rtsp://192.168.10.24:554/Streaming/Channels/101
    rtsp_sub: rtsp://192.168.10.24:554/Streaming/Channels/102
    onvif_port: 80
    onvif_user: admin
    corner: nw
    base_az_deg: 315
    offset_en_m: [-0.5, 0.5]

cube:
  half_size_m: 0.5
  mount_height_m: 1.2
  mount_orientation: upward
  home_tilt_deg: 90

ptz_calibration:
  # zoom_normalized (0..1) → hfov_deg — снять на стенде
  zoom_curve:
    - { zoom: 0.0, hfov_deg: 53.3, vfov_deg: 30.6 }
    - { zoom: 0.5, hfov_deg: 8.0, vfov_deg: 4.5 }
    - { zoom: 1.0, hfov_deg: 2.6, vfov_deg: 1.5 }
