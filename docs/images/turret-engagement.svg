<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Arial, sans-serif">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="cardTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="cardOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#c2410c"/></linearGradient>
    <linearGradient id="cardGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="cardHub" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <linearGradient id="skyG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#15803d"/></linearGradient>
    <linearGradient id="ptzG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <radialGradient id="skyZone" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <text x="480" y="36" fill="#e2e8f0" font-size="24" text-anchor="middle" font-weight="700">Фазы поражения</text>
  <text x="480" y="60" fill="#94a3b8" font-size="12" text-anchor="middle" font-weight="400">cue → coarse → acquire → track → fire</text>

  
  <rect x="75" y="116" width="130" height="80" rx="14" fill="#000" opacity="0.3"/>
  <rect x="70" y="110" width="130" height="80" rx="14" fill="url(#cardGray)" stroke="#94a3b8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="135" y="152" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">CUE</text>
  
  <rect x="235" y="116" width="130" height="80" rx="14" fill="#000" opacity="0.3"/>
  <rect x="230" y="110" width="130" height="80" rx="14" fill="url(#cardBlue)" stroke="#94a3b8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="295" y="152" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">COARSE</text>
  
  <rect x="395" y="116" width="130" height="80" rx="14" fill="#000" opacity="0.3"/>
  <rect x="390" y="110" width="130" height="80" rx="14" fill="url(#cardPurple)" stroke="#94a3b8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="455" y="152" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">ACQUIRE</text>
  
  <rect x="555" y="116" width="130" height="80" rx="14" fill="#000" opacity="0.3"/>
  <rect x="550" y="110" width="130" height="80" rx="14" fill="url(#cardTeal)" stroke="#94a3b8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="615" y="152" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">TRACK</text>
  
  <rect x="715" y="116" width="130" height="80" rx="14" fill="#000" opacity="0.3"/>
  <rect x="710" y="110" width="130" height="80" rx="14" fill="url(#cardOrange)" stroke="#94a3b8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="775" y="152" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">FIRE</text>
  

  <line x1="200" y1="150" x2="230" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="360" y1="150" x2="390" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="520" y1="150" x2="550" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="680" y1="150" x2="710" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="120" y="230" width="720" height="140" rx="16" fill="#111827" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="270" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="700">t_go = t_полёта + t_раскрытия + t_задержки</text>
  <text x="480" y="300" fill="#fca5a5" font-size="12" text-anchor="middle" font-weight="400">SAFE по умолчанию · arm только оператором</text>

</svg>