  <ellipse cx="400" cy="310" rx="70" ry="35" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="480" y="305" fill="#fbbf24" font-size="10">S2 зонт h 0-2m</text>

  <circle cx="550" cy="180" r="8" fill="#ef4444"/>
  <text x="565" y="185" fill="#fca5a5" font-size="10">цель</text>

  <rect x="80" y="420" width="640" height="45" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="400" y="448" fill="#94a3b8" font-size="10" text-anchor="middle">близко над кубом S2, у горизонта S3, середина неба - штатно</text>
