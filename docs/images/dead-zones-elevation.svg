  <line x1="80" y1="380" x2="760" y2="380" stroke="#4ade80" stroke-width="2"/>
  <text x="400" y="400" fill="#86efac" font-size="11" text-anchor="middle">горизонт el=0</text>

  <rect x="350" y="300" width="100" height="80" fill="#475569" stroke="#94a3b8"/>
  <text x="400" y="345" fill="#f8fafc" font-size="10" text-anchor="middle">куб</text>

  <rect x="385" y="285" width="30" height="20" fill="#22c55e"/>
  <line x1="400" y1="285" x2="520" y2="120" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="400" y1="285" x2="620" y2="200" stroke="#86efac" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="400" y1="285" x2="180" y2="200" stroke="#86efac" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="530" y="115" fill="#86efac" font-size="10">ось Sky tilt 25</text>

  <text x="60" y="385" fill="#64748b" font-size="10">0</text>
  <text x="45" y="300" fill="#64748b" font-size="10">30</text>
  <text x="45" y="220" fill="#64748b" font-size="10">60</text>
  <text x="45" y="140" fill="#64748b" font-size="10">90 zenith</text>

  <rect x="120" y="340" width="600" height="40" fill="#7f1d1d" opacity="0.4"/>
  <text x="130" y="365" fill="#fca5a5" font-size="10">S3 el 0-18 горизонт A</text>

  <rect x="120" y="250" width="600" height="90" fill="#22c55e" opacity="0.15"/>
  <text x="130" y="275" fill="#86efac" font-size="10">рабочий объём el 25-75 G/C</text>

  <rect x="120" y="120" width="600" height="50" fill="#2563eb" opacity="0.2"/>
