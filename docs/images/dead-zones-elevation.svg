<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="480" fill="#0f172a"/>
  <text x="400" y="32" fill="#f8fafc" font-size="18" text-anchor="middle" font-weight="700">Мёртвые зоны — разрез по углу места</text>
