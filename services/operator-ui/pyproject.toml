[project]
name = "operator-ui"
version = "0.1.0"
description = "Dron Monitoring — operator web console (static + API proxy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "websockets>=14.0",
]

[project.scripts]
operator-ui = "operator_ui.__main__:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["operator_ui*"]
