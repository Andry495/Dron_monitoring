# Dron Monitoring — Docker Compose v1
# 4× sky fixed + 4× PTZ ONVIF + ai-engine (отдельно от core)

name: dron-monitoring

services:
  monitor-core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: dron-monitoring-core
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - ai-engine
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-engine:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: dron-monitoring-ai
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8090:8090"
    mem_limit: 6g
    # GPU (опционально): раскомментировать при CUDA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: dron-monitoring_default
