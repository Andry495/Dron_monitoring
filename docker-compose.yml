# Dron Monitoring — Docker Compose v1
# 4× sky fixed + 4× PTZ ONVIF + ai-engine (отдельно от core)

name: dron-monitoring

services:
  monitor-core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: dron-monitoring-core
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - ai-engine
    environment:
      - DRY_RUN=${DRY_RUN:-true}
      - PIPELINE_MODE=${PIPELINE_MODE:-live}
      - SIMULATOR_URL=http://scenario-simulator:8070
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ai-engine:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: dron-monitoring-ai
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8090:8090"
    mem_limit: 6g
    # GPU (опционально): раскомментировать при CUDA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  turret-sim:
    profiles: ["sim", "turret"]
    build:
      context: ./services/turret-sim
      dockerfile: Dockerfile
    container_name: dron-monitoring-turret-sim
    restart: unless-stopped
    ports:
      - "8030:8030"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scenario-simulator:
    profiles: ["sim", "ui"]
    build:
      context: ./services/simulator
      dockerfile: Dockerfile
    container_name: dron-monitoring-simulator
    restart: unless-stopped
    ports:
      - "8070:8070"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  operator-ui:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: services/operator-ui/Dockerfile
    container_name: dron-monitoring-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      - CORE_URL=http://monitor-core:8080
      - SIMULATOR_URL=http://scenario-simulator:8070
      - UI_DIR=/app/ui
    depends_on:
      - monitor-core
      - scenario-simulator
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: dron-monitoring_default
